services:
  - type: web
    name: fastapi-app
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
    healthCheckPath: /
    buildCommand: ""
    preDeployCommand: "alembic upgrade head"
    startCommand: ""

databases:
  - name: fastapi-db
    plan: free
    databaseName: mydb
    user: myuser
