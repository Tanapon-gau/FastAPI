services:
  - type: web
    name: fastapi-app
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
    buildCommand: ""
    startCommand: ""

databases:
  - name: fastapi-db
    plan: free
    databaseName: mydb
    user: myuser
